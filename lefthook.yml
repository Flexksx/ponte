pre-commit:
  parallel: true
  commands:
    format-nix:
      glob: "**/*.nix"
      run: alejandra {staged_files}
      stage_fixed: true
    format-biome:
      glob: "apps/ponte/src/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: biome format --write {staged_files}
      stage_fixed: true
    lint-biome:
      glob: "apps/ponte/src/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: biome lint --error-on-warnings {staged_files}
    lint-markdown:
      glob: "**/*.md"
      run: rumdl check --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: just lint
