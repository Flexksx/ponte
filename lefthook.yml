pre-commit:
  parallel: true
  commands:
    bun-nix-sync:
      glob:
        - "bun.lock"
      run: bunx bun2nix > bun.nix && alejandra bun.nix && git add bun.nix
      stage_fixed: true
    format-nix:
      glob:
        - "*.nix"
        - "**/*.nix"
      exclude: "bun.nix"
      run: alejandra {staged_files}
      stage_fixed: true
    check-biome:
      run: >-
        biome check --write --error-on-warnings
        --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint-markdown:
      glob:
        - "*.md"
        - "**/*.md"
      run: rumdl check --fix {staged_files}
      stage_fixed: true
    no-nix-develop:
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: bash scripts/ci/no-nix-develop.sh

commit-msg:
  commands:
    no-ai-coauthor:
      run: bash scripts/ci/no-ai-coauthor.sh {1}

pre-push:
  parallel: true
  commands:
    lint:
      run: just lint
    no-nix-develop:
      run: bash scripts/ci/no-nix-develop.sh
