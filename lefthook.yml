pre-commit:
  parallel: true
  commands:
    format-nix:
      glob:
        - "*.nix"
        - "**/*.nix"
      run: alejandra {staged_files}
      stage_fixed: true
    check-biome:
      run: >-
        biome check --write --error-on-warnings
        --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint-markdown:
      glob:
        - "*.md"
        - "**/*.md"
      run: rumdl check --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: just lint
