name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Run all checks
        run: nix flake check

  bun:
    name: Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: ./out/ponte
          - os: macos-latest
            binary: ./out/ponte
          - os: windows-latest
            binary: ./out/ponte.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the standalone binary
        run: bash scripts/build.sh
      - name: Run the standalone binary
        run: ${{ matrix.binary }} --help
      - name: Run the test suite against that binary
        env:
          PONTE_E2E_BINARY: ${{ matrix.binary }}
        run: bash scripts/test.sh

  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Build the Nix package
        run: nix build .#default --print-build-logs
      - name: Run the Nix package
        run: ./result/bin/ponte --help
