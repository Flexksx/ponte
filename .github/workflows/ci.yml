name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Install dependencies
        run: nix develop --command bash -c 'cd apps/ponte && bun install --frozen-lockfile'
      - name: Check style, types and architecture
        run: nix develop --command just lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Run test suite
        run: bun test ./apps/ponte/tests
      - name: Run end-to-end tests
        env:
          PONTE_E2E: "1"
        run: bun test ./apps/ponte/tests/e2e