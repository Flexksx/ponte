name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Set up the Cachix binary cache
        uses: cachix/cachix-action@v16
        with:
          name: ponte
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check format, lint, and type errors
        run: nix flake check

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the unit tests
        run: bash scripts/test.sh unit

  bun:
    name: Bun build and e2e tests (${{ matrix.os }})
    needs: [lint, unit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: ./out/ponte
          - os: macos-latest
            binary: ./out/ponte
          - os: windows-latest
            binary: ./out/ponte.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile the standalone binary
        run: bash scripts/build.sh
      - name: Run the standalone binary
        run: ${{ matrix.binary }} --help
      - name: Run the e2e tests against that binary
        env:
          PONTE_E2E_BINARY: ${{ matrix.binary }}
        run: bash scripts/test.sh e2e

  nix:
    name: Nix build (${{ matrix.os }})
    needs: [lint, unit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Set up the Cachix binary cache
        uses: cachix/cachix-action@v16
        with:
          name: ponte
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Nix package
        run: nix build .#default --print-build-logs
      - name: Run the Nix package
        run: ./result/bin/ponte --help
