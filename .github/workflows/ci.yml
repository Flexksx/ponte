name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      # `just lint` runs `biome lint`, which covers neither formatting nor the
      # import-sorting assist. `biome check` covers all three, and matches what
      # the lefthook pre-commit hook writes.
      - name: Check TypeScript formatting
        run: nix develop --command biome check --error-on-warnings ./apps/ponte/src ./apps/ponte/tests
      - name: Check Nix formatting
        run: nix develop --command alejandra --check .
      - name: Check Markdown
        run: nix develop --command rumdl check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Install dependencies
        run: nix develop --command bash -c 'cd apps/ponte && bun install --frozen-lockfile'
      - name: Check style, types and architecture
        run: nix develop --command just lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      # The end-to-end suite compiles the CLI, which imports chalk. Without
      # this step every test that spawns the binary fails to resolve it.
      - name: Install dependencies
        working-directory: apps/ponte
        run: bun install --frozen-lockfile
      - name: Run test suite
        run: bun test ./apps/ponte/tests

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate every flake output
        run: nix flake check
      - name: Build the package
        run: nix build .#default
      - name: Run the built binary
        run: ./result/bin/ponte --help
