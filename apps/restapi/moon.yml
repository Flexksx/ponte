$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
stack: 'backend'
tags: ['typescript']

tasks:
  dev:
    command: 'bun run --hot src/index.ts'
    toolchains: 'system'
    options:
      cache: false
      persistent: true

  db-generate:
    command: 'bunx drizzle-kit generate'
    toolchains: 'system'
    options:
      cache: false

  db-migrate:
    command: 'bun run src/db/migrate.ts'
    toolchains: 'system'
    options:
      cache: false
