<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ponte</title>
    <style>
      :root {
        --bg: #fafaf9;
        --surface: #ffffff;
        --text: #1c1917;
        --muted: #78716c;
        --border: #e7e5e4;
        --accent: #0f766e;
        --accent-soft: #ccfbf1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --surface: #1c1917;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --border: #292524;
          --accent: #5eead4;
          --accent-soft: #134e4a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, sans-serif;
      }
      header, main { max-width: 960px; margin: 0 auto; padding: 0 16px; }
      header { display: flex; gap: 24px; align-items: baseline; padding-top: 24px; }
      header h1 { margin: 0; font-size: 20px; }
      nav { display: flex; gap: 16px; }
      a { color: var(--accent); }
      nav a { color: var(--muted); text-decoration: none; }
      nav a:hover { color: var(--accent); }
      section { padding: 24px 0; border-bottom: 1px solid var(--border); }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
      h3 { margin: 0 0 4px; font-size: 17px; }
      h4 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
      .goal { margin: 0; }
      .next { margin: 10px 0 0; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); }
      ul { margin: 0; padding-left: 18px; }
      li { margin: 2px 0; overflow-wrap: anywhere; }
      code { font: 13px ui-monospace, monospace; }
      .note, .date, .empty { color: var(--muted); }
      .error { color: #dc2626; }
      table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
      th { font-size: 13px; color: var(--muted); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>ponte</h1>
      <nav>
        <a href="#workspaces">Workspaces</a>
        <a href="#skills">Skills</a>
        <a href="#subagents">Subagents</a>
      </nav>
    </header>
    <main>
      <section id="workspaces"><h2>Workspaces</h2><div></div></section>
      <section id="skills"><h2>Skills</h2><div></div></section>
      <section id="subagents"><h2>Subagents</h2><div></div></section>
    </main>
    <script type="module">
      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) { node.className = className; }
        if (text !== undefined) { node.textContent = text; }
        return node;
      };

      const isWebAddress = target => /^https?:\/\//.test(target);

      const linkItem = link => {
        const item = element("li");
        if (isWebAddress(link.target)) {
          const anchor = element("a", "", link.target);
          anchor.href = link.target;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          item.append(anchor);
        } else {
          item.append(element("code", "", link.target));
        }
        if (link.note) { item.append(element("span", "note", ` - ${link.note}`)); }
        return item;
      };

      const decisionItem = decision => {
        const item = element("li");
        item.append(element("span", "date", `${decision.date} `), decision.text);
        return item;
      };

      const listOf = (heading, entries, toItem) => {
        const fragment = document.createDocumentFragment();
        if (entries.length === 0) { return fragment; }
        const list = element("ul");
        list.append(...entries.map(toItem));
        fragment.append(element("h4", "", heading), list);
        return fragment;
      };

      const workspaceCard = workspace => {
        const card = element("article", "card");
        card.append(element("h3", "", workspace.name), element("p", "goal", workspace.goal));
        if (workspace.next) { card.append(element("p", "next", `Next: ${workspace.next}`)); }
        card.append(
          listOf("Links", workspace.links, linkItem),
          listOf("Decisions", [...workspace.decisions].reverse(), decisionItem),
        );
        return card;
      };

      const sourceText = entry =>
        [entry.source, entry.ref && `@ ${entry.ref}`, entry.subdir && `/ ${entry.subdir}`]
          .filter(Boolean)
          .join(" ");

      const table = (headings, rows) => {
        const node = element("table");
        const head = element("tr");
        head.append(...headings.map(heading => element("th", "", heading)));
        node.append(head);
        for (const cells of rows) {
          const row = element("tr");
          row.append(...cells.map(cell => element("td", "", cell)));
          node.append(row);
        }
        return node;
      };

      const fill = async (id, path, render, emptyText) => {
        const target = document.querySelector(`#${id} div`);
        const response = await fetch(path);
        const body = await response.json();
        if (!response.ok) {
          target.replaceChildren(element("p", "error", body.error));
          return;
        }
        const node = render(body);
        target.replaceChildren(node ?? element("p", "empty", emptyText));
      };

      fill("workspaces", "/api/workspaces", workspaces => {
        if (workspaces.length === 0) { return null; }
        const fragment = document.createDocumentFragment();
        fragment.append(...workspaces.map(workspaceCard));
        return fragment;
      }, "No workspaces yet. An agent creates one with ponte ws new.");

      fill("skills", "/api/skills", listing =>
        listing.rows.length === 0
          ? null
          : table(["Name", "Source"], listing.rows.map(row => [row.name ?? "—", sourceText(row.entry)])),
        "No skills configured.");

      fill("subagents", "/api/subagents", entries =>
        entries.length === 0 ? null : table(["Source"], entries.map(entry => [sourceText(entry)])),
        "No subagents configured.");
    </script>
  </body>
</html>
